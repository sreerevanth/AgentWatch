# AWBench registry — benchmark definitions and PRE-REGISTERED thresholds.
#
# Thresholds are targets written before results were seen. Measured values live only in
# results/*.json (machine-generated). Changing a threshold requires a dated changelog
# entry below that predates the results it applies to.
version: 1
changelog:
  - date: 2026-09-25
    note: >
      Initial registry. H4 is measured as top-1 localization plus "root cause at or upstream
      of the reported divergence" instead of the top-3 metric sketched in
      RESEARCH_HYPOTHESES.md, because the v3 comparator reports a single earliest divergence.

  - date: 2026-09-26
    note: >
      Added held-out architecture map_reduce (fan-out workers, multi-parent reducer, critic).
      It was designed after AgentWatch development and is scored separately with the same
      thresholds. AgentWatch code is not to be changed in response to its results before they
      are recorded.
  - date: 2026-09-26
    note: >
      Ground-truth corrections to map_reduce after its first run (results of that run are kept
      in results/): retrieval perturbations now hit only worker 1 as the ground truth states
      (they previously hit all workers), the message_loss root cause is the missing message,
      and lab tasks intervene on the ground-truth root-cause retrieval instead of the first
      retrieval. No AgentWatch code was changed.
  - date: 2026-09-26
    note: >
      Information-flow reachability (H2) follows flow relations only (PRODUCES, CONSUMES,
      DERIVES_FROM, CONTAINS_ITEM, TRANSFERS), matching provenance. AgentWatch added a
      non-flow MATCHES_CONTENT relation (content similarity into externally sourced artifacts).
  - date: 2026-09-26
    note: >
      Added a second held-out architecture, hybrid_rag_cache (vector + keyword retrieval,
      dedupe tool, answerer over a growing multi-turn history, cache write/read-back). It was
      designed after the most-recent-producer traversal, MATCHES_CONTENT and M005 v2 changes
      and is committed before its first run, so its results are held-out evidence for them.
      map_reduce informed those changes and is now reported as "used for development" for the
      affected metrics. Held-out results are reported per architecture, no longer pooled.
      AgentWatch code is not to be changed in response to hybrid_rag_cache results before
      they are recorded.
  - date: 2026-09-26
    note: >
      hybrid_rag_cache first run recorded unchanged (commit 0ae22dc). AgentWatch then changed
      in response (content-containment shortcuts through an intermediate are reduced), so
      hybrid_rag_cache is no longer held-out evidence for H2 information precision or H5.
      A third held-out architecture is needed to validate that change.
  - date: 2026-09-26
    note: >
      Ground-truth correction (benchmark, not AgentWatch): M006 (information bottleneck) is a
      structural property of a run, not an injected fault, but only hybrid_rag_cache declared
      it. Its expectation is now derived for every run from the ground-truth data flow using
      the motif's definition (tasks.true_bottleneck). Made after seeing M006 fire on the
      development set once content shortcuts were reduced; both the scenario-declared and the
      derived scoring can be reproduced from the recorded ground truth.
  - date: 2026-09-26
    note: >
      Pre-registered the third held-out architecture async_event_pipeline (architecture commit
      88f46a9); see architecture_status.async_event_pipeline.preregistration. Added computed
      architecture status (DEVELOPMENT / HELD_OUT / FORMER_HELD_OUT).

systems:
  tool_loop: single model-driven tool loop (native SDK; OTel variant for H1)
  rag_memory: retrieval, summarization, memory write/read, second retrieval round
  multi_agent: planner delegating to researcher/analyst/critic, synthesizer join
  map_reduce: HELD-OUT; planner fans out to 3 workers, reducer joins (multi-parent), critic model
  hybrid_rag_cache: HELD-OUT; vector+keyword retrieval, dedupe, answerer over growing history, cache read-back
  async_event_pipeline: HELD-OUT; asyncio workers completing out of order, at-least-once queue, discarded draft, glossary cache hit, db read-back

# Evidence status of each architecture. The runner COMPUTES the effective status:
#   DEVELOPMENT      used while building AgentWatch
#   HELD_OUT         declared held-out and AgentWatch (agentwatch/) is unchanged since its first
#                    scored run, or it has not been scored yet
#   FORMER_HELD_OUT  declared held-out, but agentwatch/ changed after its first scored run: its
#                    later numbers can have been shaped by it and are development evidence
# first_scored_run records the commit and results file of the first scored run.
architecture_status:
  tool_loop: {declared: DEVELOPMENT}
  rag_memory: {declared: DEVELOPMENT}
  multi_agent: {declared: DEVELOPMENT}
  map_reduce:
    declared: HELD_OUT
    first_scored_run: {commit: bc93ce5, results: awbench-20260926T074623Z.json}
  hybrid_rag_cache:
    declared: HELD_OUT
    first_scored_run: {commit: 1cf3886, results: awbench-20260926T104846Z.json}
  async_event_pipeline:
    declared: HELD_OUT
    # PRE-REGISTRATION (2026-09-26), recorded before any scored run and before the
    # information-instance / provenance-hierarchy changes it is meant to test.
    preregistration:
      architecture_commit: 88f46a9
      scenarios: [normal, bad_retrieval, corrupted_retrieval, tool_timeout, model_substitution, message_loss, stale_memory]
      seeds: 3
      sensor: native, value-level spans only (no explicit instance references)
      tasks: [h2_structure, h3_lineage, h4_divergence, h5_motifs, replay_fidelity, counterfactual_quality, explanation_faithfulness]
      thresholds: same as the tasks section of this registry (not to be changed after the run)
      expected_structure: >
        request -> shared evidence retrieval -> 3 task messages -> workers (A: own retrieval;
        B: discarded draft + analysis with identical text; C: lookup retries) -> results queue
        (A delivered twice; the aggregator uses the first delivery of each worker) -> merge ->
        glossary cache (2 misses with define+write, 1 hit whose value equals define#1's output)
        -> enrich -> db write -> db read -> report. Information flows are the ground-truth
        data_edges written by workbench.py; the draft and the second delivery of A have no
        outgoing flow. Root causes: bad_retrieval fetch_evidence#1; corrupted_retrieval
        retrieve:A#1; tool_timeout lookup:C#2; model_substitution the first model call to
        execute; message_loss deliver:C#1; stale_memory read:db#1. Motifs: M001 always, M002
        in tool_timeout, M006 derived from ground-truth flow.
      evaluation: >
        tasks.py semantics at this commit. Mechanical adaptation of the evaluator to new graph
        node names is allowed before the run only if it does not change what is counted, and
        is logged in the changelog. Run with --first-scored-run async_event_pipeline --seeds 3
        on a clean tree; results are committed exactly as generated before any diagnosis.

scenarios:
  tool_loop: [normal, bad_retrieval, corrupted_retrieval, tool_timeout, tool_error, incorrect_tool_result, context_pressure, model_substitution, latency_injection, retry_loop]
  rag_memory: [normal, bad_retrieval, corrupted_retrieval, stale_memory, duplicate_memory, model_substitution, latency_injection]
  multi_agent: [normal, bad_retrieval, corrupted_retrieval, tool_timeout, message_duplication, message_loss, model_substitution, delegation_loop, resource_contention, retry_loop]

held_out:
  map_reduce: [normal, bad_retrieval, corrupted_retrieval, tool_timeout, model_substitution, message_loss, latency_injection]
  hybrid_rag_cache: [normal, bad_retrieval, corrupted_retrieval, stale_memory, duplicate_memory, model_substitution, tool_timeout]
  async_event_pipeline: [normal, bad_retrieval, corrupted_retrieval, tool_timeout, model_substitution, message_loss, stale_memory]

held_out_notes:
  map_reduce: >
    Informed fixes after its first runs (ground-truth corrections; M005 v2; most-recent-producer
    traversal; MATCHES_CONTENT). Its information-precision and motif-precision numbers are
    development evidence, not held-out evidence.
  hybrid_rag_cache: >
    Its first run (results/awbench-20260926T104846Z.json, commit 1cf3886) is the held-out
    evidence: information precision 0.53 and motif recall 0.55 failed. It then informed the
    content-shortcut reduction (graph.information@5); later numbers are development evidence.

tasks:
  h1_normalization:
    hypothesis: H1
    capability: events.normalization.*
    thresholds: {kind_coverage: 0.95, cross_source_kind_f1: 0.9}
  h2_structure:
    hypothesis: H2
    capability: graph.execution, graph.information
    thresholds: {execution_f1: 0.9, information_recall: 0.75, information_precision: 0.75}
  h3_lineage:
    hypothesis: H3
    capability: provenance.lineage
    thresholds: {lineage_membership_f1: 0.8}
  h4_divergence:
    hypothesis: H4
    capability: compare.runs
    thresholds: {top1_localization: 0.7, root_at_or_upstream: 0.9}
  h5_motifs:
    hypothesis: H5
    capability: behaviour.motifs
    thresholds: {micro_precision: 0.9, micro_recall: 0.8}
  h7_drift:
    hypothesis: H7
    capability: behaviour.drift
    thresholds: {detects_model_substitution: true, control_flagged_features_max: 0}
  replay_fidelity:
    capability: lab.replay
    thresholds: {l1_consistency: 1.0, l2_mean_reproduction: 0.99}
  counterfactual_quality:
    hypothesis: H10
    capability: lab.counterfactual
    thresholds: {simulated_outcome_accuracy: 0.8}
  causal_hypotheses:
    hypothesis: H8
    capability: causality.hypotheses
    thresholds: {true_hypothesis_supported: 0.8, control_not_supported: 0.8}
  explanation_faithfulness:
    capability: query.engine
    thresholds: {evidence_resolves: 1.0, numbers_grounded: 0.95}
